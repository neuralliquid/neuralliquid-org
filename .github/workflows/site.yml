name: Static Site Validation

on:
  pull_request:
    paths:
      - "site/**"
      - "scripts/validate-site.mjs"
      - ".github/workflows/site.yml"
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "scripts/validate-site.mjs"
permissions:
  contents: read

jobs:
  validate:
    name: Validate static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate pages and local links
        run: node scripts/validate-site.mjs
